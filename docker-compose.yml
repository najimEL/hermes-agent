services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: ${HERMES_AGENT_CONTAINER_NAME:-hermes-agent}
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file:
      - $PROJECT_DIR/.env
    environment:
      API_SERVER_KEY: ${API_SERVER_KEY:-}
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-1}
      HERMES_DASHBOARD_HOST: ${HERMES_DASHBOARD_HOST:-0.0.0.0}
      HERMES_DASHBOARD_INSECURE: ${HERMES_DASHBOARD_INSECURE:-1}
    ports:
      - "${HERMES_API_PORT:-8642}:8642"   # gateway API
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"   # dashboard
    volumes:
      - $PROJECT_DIR/.hermes-data:/opt/data
      - $PROJECT_DIR/.hermes-home:/home/hermes

  hermes-dashboard:
    image: ghcr.io/outsourc-e/hermes-workspace:latest
    container_name: ${HERMES_WORKSPACE_CONTAINER_NAME:-hermes-dashboard}
    restart: unless-stopped
    env_file:
      - $PROJECT_DIR/.env
    environment:
      HERMES_API_URL: http://localhost:8642
      HERMES_DASHBOARD_URL: http://localhost:9119
      HERMES_API_TOKEN: ${API_SERVER_KEY:-}
    ports:
      - "${HERMES_WORKSPACE_WEB_PORT:-3000}:3000"
    depends_on:
      - hermes-agent
