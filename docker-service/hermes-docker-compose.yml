services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: ${HERMES_AGENT_CONTAINER_NAME:-hermes-agent}
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file:
      - ./.env
    environment:
      API_SERVER_KEY: ${API_SERVER_KEY:-}
      DASHBOARD_MODE: 1
    ports:
      - "${HERMES_API_PORT:-8642}:8642"   # gateway API
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"   # dashboard
    volumes:
      - ${HERMES_DATA_PATH:-../.hermes}:/opt/data
      - ../docker-service:/opt/data/docker-service
      - ../templates:/opt/data/templates
      - ../backups:/opt/data/backups
      - ../README.md:/opt/data/README.md
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  hermes-dashboard:
    image: ghcr.io/outsourc-e/hermes-workspace:latest
    container_name: ${HERMES_WORKSPACE_CONTAINER_NAME:-hermes-dashboard}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      HERMES_API_URL: http://hermes-agent:8642
      HERMES_DASHBOARD_URL: http://hermes-agent:9119
      HERMES_API_TOKEN: ${API_SERVER_KEY:-}
    ports:
      - "${HERMES_WORKSPACE_WEB_PORT:-3000}:3000"
    depends_on:
      - hermes-agent
